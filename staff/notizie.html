<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione notizie · Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="../photos/logo.jpeg">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="staff-shell">
    <div class="container">
      <div class="staff-hero">
        <div>
          <h1>Gestione notizie</h1>
          <p id="staff-meta" data-static="1">Pubblica aggiornamenti che compaiono in home e nella pagina Notizie.</p>
        </div>
        <div class="inline-actions">
          <a class="btn btn-ghost" href="../notizie.html" target="_blank" rel="noopener">Vedi pagina pubblica</a>
          <a class="btn btn-ghost" href="./index.html">← Dashboard</a>
        </div>
      </div>

      <div id="news-alert" class="alert alert-ok" hidden></div>

      <div class="staff-grid">
        <section class="panel">
          <h2 id="news-form-title">Nuova notizia</h2>
          <form id="news-form" class="form-grid">
            <input type="hidden" name="id" value="">
            <label>
              Titolo
              <input type="text" name="title" required placeholder="Es. Campo estivo 2026">
            </label>
            <label>
              Data
              <input type="date" name="date" required>
            </label>
            <label>
              Testo
              <textarea name="body" rows="5" required placeholder="Scrivi la comunicazione…"></textarea>
            </label>
            <div class="inline-actions">
              <button class="btn btn-primary" type="submit">Salva</button>
              <button class="btn btn-ghost" type="button" id="news-reset" hidden>Annulla modifica</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <h2>Notizie pubblicate</h2>
          <p class="hint">La più recente compare anche nella tile Notizie in home.</p>
          <div id="news-admin-list"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/cloud-sync.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/canzoniere-store.js"></script>
  <script src="../js/news-store.js"></script>
  <script src="../js/branch-view.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/staff-shell.js"></script>
  <script src="../js/news-staff.js"></script>
</body>
</html>
