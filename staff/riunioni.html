<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione riunioni · Staff</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="../photos/logo.jpeg">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="staff-shell">
    <div class="container">
      <div class="staff-hero">
        <div>
          <h1>Gestione riunioni</h1>
          <p id="staff-meta" data-static="1">Orari settimanali per branca e sede.</p>
        </div>
        <a class="btn btn-ghost" href="./index.html">← Dashboard</a>
      </div>

      <section class="panel" id="meeting-hours-panel">
        <p class="hint" id="meeting-hours-hint"></p>
        <div id="meeting-hours-editor"></div>
        <div class="inline-actions" style="margin-top:1rem">
          <button type="button" class="btn btn-primary" id="meeting-hours-save">Salva orari</button>
        </div>
        <div id="meeting-hours-alert" class="alert alert-ok" hidden style="margin-top:.75rem"></div>
      </section>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/canzoniere-store.js"></script>
  <script src="../js/branch-view.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/staff-shell.js"></script>
  <script src="../js/staff-riunioni.js"></script>
</body>
</html>
