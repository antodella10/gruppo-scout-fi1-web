<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link social · Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="../photos/logo.jpeg">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="staff-shell">
    <div class="container">
      <div class="staff-hero">
        <div>
          <h1>Gestione link social</h1>
          <p id="staff-meta" data-static="1">Facebook e Instagram — visibili in home e contatti.</p>
        </div>
        <a class="btn btn-ghost" href="./index.html">← Dashboard</a>
      </div>

      <section class="panel">
        <form id="social-form" class="form-grid">
          <label>
            Facebook
            <input type="url" name="facebook" placeholder="https://www.facebook.com/...">
          </label>
          <label>
            Instagram gruppo (Firenze 1)
            <input type="url" name="igGruppo" placeholder="https://www.instagram.com/...">
          </label>
          <label>
            Instagram lupetti
            <input type="url" name="igLupetti" placeholder="https://www.instagram.com/...">
          </label>
          <label>
            Instagram reparto
            <input type="url" name="igReparto" placeholder="https://www.instagram.com/...">
          </label>
          <label>
            Instagram noviziato
            <input type="url" name="igNoviziato" placeholder="Opzionale">
          </label>
          <label>
            Instagram clan
            <input type="url" name="igClan" placeholder="Opzionale">
          </label>
          <button class="btn btn-primary" type="submit">Salva social</button>
        </form>
        <div id="social-alert" class="alert alert-ok" hidden style="margin-top:.75rem"></div>
      </section>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/canzoniere-store.js"></script>
  <script src="../js/branch-view.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/staff-shell.js"></script>
  <script src="../js/staff-social.js"></script>
</body>
</html>
