<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link social · Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="../photos/logo.jpeg">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="staff-shell">
    <div class="container">
      <div class="staff-hero">
        <div>
          <h1>Gestione link social</h1>
          <p id="staff-meta" data-static="1">Nomi e URL. Spunta “In home” sull’Instagram da mostrare in Seguici.</p>
        </div>
        <a class="btn btn-ghost" href="./index.html">← Dashboard</a>
      </div>

      <section class="panel">
        <form id="social-form" class="form-grid">
          <h3 class="social-form-heading">Facebook</h3>
          <div class="form-row-2">
            <label>
              Nome
              <input type="text" name="fbLabel" placeholder="Facebook">
            </label>
            <label>
              URL
              <input type="url" name="fbUrl" placeholder="https://www.facebook.com/...">
            </label>
          </div>

          <h3 class="social-form-heading">Instagram</h3>
          <p class="hint" style="margin:0">Spunta la casella “In home” accanto al profilo da usare nell’icona Instagram della home.</p>

          <div class="social-ig-row" data-ig="gruppo">
            <label class="home-ig-check">
              <input type="radio" name="homeInstagram" value="gruppo">
              <span>In home</span>
            </label>
            <div class="form-row-2">
              <label>Nome <input type="text" name="igGruppoLabel"></label>
              <label>URL <input type="url" name="igGruppoUrl" placeholder="https://www.instagram.com/..."></label>
            </div>
          </div>
          <div class="social-ig-row" data-ig="branco">
            <label class="home-ig-check">
              <input type="radio" name="homeInstagram" value="branco">
              <span>In home</span>
            </label>
            <div class="form-row-2">
              <label>Nome <input type="text" name="igBrancoLabel"></label>
              <label>URL <input type="url" name="igBrancoUrl" placeholder="https://www.instagram.com/..."></label>
            </div>
          </div>
          <div class="social-ig-row" data-ig="reparto">
            <label class="home-ig-check">
              <input type="radio" name="homeInstagram" value="reparto" checked>
              <span>In home</span>
            </label>
            <div class="form-row-2">
              <label>Nome <input type="text" name="igRepartoLabel"></label>
              <label>URL <input type="url" name="igRepartoUrl" placeholder="https://www.instagram.com/..."></label>
            </div>
          </div>
          <div class="social-ig-row" data-ig="noviziato">
            <label class="home-ig-check">
              <input type="radio" name="homeInstagram" value="noviziato">
              <span>In home</span>
            </label>
            <div class="form-row-2">
              <label>Nome <input type="text" name="igNoviziatoLabel"></label>
              <label>URL <input type="url" name="igNoviziatoUrl" placeholder="Opzionale"></label>
            </div>
          </div>
          <div class="social-ig-row" data-ig="clan">
            <label class="home-ig-check">
              <input type="radio" name="homeInstagram" value="clan">
              <span>In home</span>
            </label>
            <div class="form-row-2">
              <label>Nome <input type="text" name="igClanLabel"></label>
              <label>URL <input type="url" name="igClanUrl" placeholder="Opzionale"></label>
            </div>
          </div>

          <button class="btn btn-primary" type="submit">Salva social</button>
        </form>
        <div id="social-alert" class="alert alert-ok" hidden style="margin-top:.75rem"></div>
      </section>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/cloud-sync.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/canzoniere-store.js"></script>
  <script src="../js/shop-store.js"></script>
  <script src="../js/staff-notifs.js"></script>
  <script src="../js/branch-view.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/staff-shell.js"></script>
  <script src="../js/staff-social.js"></script>
</body>
</html>
