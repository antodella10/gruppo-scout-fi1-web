<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria · Staff</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="staff-shell">
    <div class="container">
      <div class="staff-hero">
        <div>
          <h1>Galleria</h1>
          <p id="staff-meta" data-static="1">Organizza le foto in cartelle, come su un telefono.</p>
        </div>
        <div class="inline-actions">
          <a class="btn btn-ghost" href="./documenti.html">← File e documenti</a>
          <a class="btn btn-ghost" href="../chi-siamo.html#galleria" target="_blank" rel="noopener">Vedi su Chi siamo</a>
        </div>
      </div>

      <div id="gallery-alert" class="alert alert-ok" hidden></div>

      <!-- Vista cartelle -->
      <section class="panel gal-panel" id="gal-folders-view">
        <div class="gal-toolbar">
          <h2 style="margin:0">Cartelle</h2>
          <div class="inline-actions">
            <button type="button" class="btn btn-ghost btn-small" id="featured-edit-btn">Modifica foto in evidenza</button>
            <button type="button" class="btn btn-primary btn-touch" id="folder-add-btn" aria-label="Nuova cartella">+</button>
          </div>
        </div>
        <p class="hint gal-hint-mobile">Tieni premuta una cartella per rinomarla o eliminarla.</p>
        <div id="gal-folders-grid" class="gal-folders-grid"></div>
        <div id="gal-unfiled" class="gal-unfiled"></div>
      </section>

      <!-- Vista dentro cartella -->
      <section class="panel gal-panel" id="gal-folder-view" hidden>
        <div class="gal-toolbar">
          <button type="button" class="btn btn-ghost btn-small" id="gal-back-folders">← Cartelle</button>
          <h2 id="gal-folder-title" style="margin:0;flex:1">Cartella</h2>
          <label class="btn btn-primary btn-touch gal-upload-btn" title="Carica foto">
            <span aria-hidden="true">⬆</span>
            <span class="sr-only">Carica foto</span>
            <input type="file" id="gal-upload-input" accept="image/*" multiple hidden>
          </label>
        </div>
        <label class="gal-branca-label">
          Branca per i nuovi upload
          <select id="gal-upload-branca"></select>
        </label>
        <div id="gal-upload-progress" class="gallery-upload-progress" hidden>
          <div class="gallery-upload-bar"><span id="gal-upload-bar"></span></div>
          <p id="gal-upload-status" class="hint"></p>
        </div>
        <div id="gal-photos-grid" class="gal-photos-grid"></div>
      </section>

      <!-- Modal selezione evidenza -->
      <section class="panel gal-panel" id="gal-featured-view" hidden>
        <div class="gal-toolbar">
          <h2 style="margin:0">Foto in evidenza <span class="hint" id="featured-count">(0/15)</span></h2>
          <div class="inline-actions">
            <button type="button" class="btn btn-ghost btn-small" id="featured-cancel">Annulla</button>
            <button type="button" class="btn btn-primary btn-small" id="featured-save">Salva</button>
          </div>
        </div>
        <p class="hint">Seleziona fino a 15 foto, poi conferma con Salva.</p>
        <div id="gal-featured-grid" class="gal-photos-grid"></div>
      </section>
    </div>
  </main>

  <!-- Lightbox foto + azioni -->
  <div id="gal-lightbox" class="gal-lightbox" hidden>
    <button type="button" class="btn btn-ghost gal-lb-close" id="gal-lb-close" aria-label="Chiudi">✕</button>
    <img id="gal-lb-img" alt="">
    <p class="gal-lb-cap" id="gal-lb-cap"></p>
    <div class="gal-lb-sheet" role="toolbar" aria-label="Azioni foto">
      <button type="button" class="gal-lb-action" id="gal-lb-move">Sposta</button>
      <button type="button" class="gal-lb-action" id="gal-lb-rename">Rinomina</button>
      <button type="button" class="gal-lb-action" id="gal-lb-caption">Didascalia</button>
      <button type="button" class="gal-lb-action gal-lb-danger" id="gal-lb-delete">Elimina</button>
    </div>
  </div>

  <!-- Menu contestuale cartella -->
  <div id="gal-ctx" class="gal-ctx" hidden>
    <button type="button" data-ctx="rename">Rinomina</button>
    <button type="button" data-ctx="delete">Elimina</button>
    <button type="button" data-ctx="cancel">Annulla</button>
  </div>
  <div id="gal-ctx-backdrop" class="gal-ctx-backdrop" hidden></div>

  <script src="../js/config.js"></script>
  <script src="../js/cloud-sync.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/canzoniere-store.js"></script>
  <script src="../js/shop-store.js"></script>
  <script src="../js/staff-notifs.js"></script>
  <script src="../js/gallery-store.js"></script>
  <script src="../js/branch-view.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/staff-shell.js"></script>
  <script src="../js/gallery-staff.js"></script>
</body>
</html>
