<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifica OTP · Firenze 1</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="../photos/logo.jpeg">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Verifica OTP</h1>
      <p class="lead">
        Inserisci il codice a 6 cifre che ti ha comunicato la mail di gruppo
        (<strong>scoutfirenze1ms@gmail.com</strong> dopo l’approvazione.
      </p>
      <div id="auth-alert" class="alert alert-error" hidden></div>
      <form id="verify-form" class="form-grid">
        <label>
          Email usata in registrazione
          <input type="email" name="email" required autocomplete="username">
        </label>
        <label>
          Codice OTP
          <input type="text" name="otp" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 cifre" autocomplete="one-time-code">
        </label>
        <button class="btn btn-primary" type="submit">Attiva account</button>
      </form>
      <p class="form-note"><a href="register.html">Nuova registrazione</a> · <a href="login.html">Login</a></p>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
