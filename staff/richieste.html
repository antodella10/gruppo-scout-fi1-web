<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Richieste account · Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="staff-shell">
    <div class="container">
      <div class="staff-hero">
        <div>
          <h1>Richieste account</h1>
          <p id="staff-meta" data-static="1">Staff e repartari.</p>
        </div>
        <a class="btn btn-ghost" href="./index.html">← Dashboard</a>
      </div>

      <div id="richieste-status" class="alert alert-ok" hidden></div>

      <div class="account-requests-grid">
        <section class="panel account-requests-col" id="section-staff">
          <h2 class="account-requests-title account-requests-title-staff">Staff</h2>

          <div class="account-requests-block">
            <h3>In attesa</h3>
            <div id="pending-staff-list"></div>
          </div>

          <div class="account-requests-block">
            <h3>Account attivi</h3>
            <div id="accounts-staff-list"></div>
          </div>
        </section>

        <section class="panel account-requests-col" id="section-ragazzi">
          <h2 class="account-requests-title account-requests-title-ragazzi">Repartari</h2>

          <div class="account-requests-block">
            <h3>In attesa</h3>
            <div id="pending-ragazzi-list"></div>
          </div>

          <div class="account-requests-block">
            <h3>Account attivi</h3>
            <div id="accounts-ragazzi-list"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/cloud-sync.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/canzoniere-store.js"></script>
  <script src="../js/shop-store.js"></script>
  <script src="../js/staff-notifs.js"></script>
  <script src="../js/branch-view.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/staff-shell.js"></script>
  <script src="../js/staff-richieste.js"></script>
</body>
</html>
