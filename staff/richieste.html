<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Richieste staff · Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="../photos/logo.jpeg">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="staff-shell">

      <div class="staff-hero">
        <div>
          <h1>Richieste staff</h1>

        </div>

      </div>

      <section class="panel">
        <h2 style="margin-top:0">In attesa di approvazione</h2>
        <div id="pending-list"></div>

      <section class="panel" style="margin-top:1.1rem">
        <h2 style="margin-top:0">Account staff</h2>
        <p class="hint">Elenco degli account attivi. Puoi eliminarli se non servono più (l’admin principale resta protetto).</p>
        <div id="accounts-list"></div>
      </section>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/cloud-sync.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/canzoniere-store.js"></script>
  <script src="../js/shop-store.js"></script>
  <script src="../js/staff-notifs.js"></script>
