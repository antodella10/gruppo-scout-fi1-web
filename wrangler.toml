name = "scout-firenze1"
main = "workers/scout-api.js"
compatibility_date = "2026-09-08"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Binding KV persistente nei deploy Git (non togliere).
[[kv_namespaces]]
binding = "SCOUT_KV"
id = "2334c813ef4c4d9b96463a7688f8d656"

# Bucket R2 per la galleria foto (crealo in Dashboard se non esiste).
[[r2_buckets]]
binding = "SCOUT_R2"
bucket_name = "firenze1-gallery"

# Email di approvazione account (opzionale, da impostare in Dashboard → Variables / Secrets):
# APPROVAL_MAIL_WEBHOOK = URL Google Apps Script (invia come scoutfirenze1ms@gmail.com)
# APPROVAL_MAIL_SECRET  = stesso secret dello script
# oppure:
# RESEND_API_KEY = re_...
# MAIL_FROM = Firenze 1 <beth.t@example.com>
# MAIL_FROM_EMAIL = scoutfirenze1ms@gmail.com
