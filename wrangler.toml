name = "scout-firenze1"
main = "workers/scout-api.js"
compatibility_date = "2026-09-08"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# IMPORTANTE: senza questo blocco ogni deploy Git può togliere il binding KV
# e la sync torna in 503. Dopo aver creato il namespace in Dashboard → KV,
# copia l’ID (stringa lunga) al posto di REPLACE_WITH_KV_NAMESPACE_ID.
#
# [[kv_namespaces]]
# binding = "SCOUT_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
