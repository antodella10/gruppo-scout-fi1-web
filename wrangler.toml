name = "scout-firenze1"
main = "workers/scout-api.js"
compatibility_date = "2026-09-08"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Binding KV persistente nei deploy Git (non togliere).
[[kv_namespaces]]
binding = "SCOUT_KV"
id = "2334c813ef4c4d9b96463a7688f8d656"

# Bucket R2 per la galleria foto (crealo in Dashboard se non esiste).
[[r2_buckets]]
binding = "SCOUT_R2"
bucket_name = "firenze1-gallery"

# Email approvazione: NON mettere i valori qui (repo pubblico).
# In Cloudflare Dashboard → Worker scout-firenze1 → Settings → Variables and Secrets:
#   aggiungi come "Secret" (non Variable semplice), così restano dopo i deploy Git:
#   - APPROVAL_MAIL_WEBHOOK  = URL App web Google Apps Script (.../exec)
#   - APPROVAL_MAIL_SECRET   = stesso secret nello script (tools/approval-mail-apps-script.js)
# Se usi Variable semplici senza Secrets, al prossimo deploy possono sparire
# (è il messaggio giallo "Update your Wrangler configuration").
# Non copiare i secret in wrangler.toml / GitHub.
