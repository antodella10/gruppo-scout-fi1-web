<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crea account · Firenze 1</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card auth-card-wide">
      <h1>Crea account</h1>
      <p class="lead" data-register-intro>Scegli il tipo di account e compila i dati.</p>
      <div id="auth-alert" class="alert alert-error" hidden></div>

      <div class="role-picker" data-register-fields role="radiogroup" aria-label="Tipo account">
        <button type="button" class="role-pick is-active" data-role="ragazzo" aria-pressed="true">
          Esploratore / guida
        </button>
        <button type="button" class="role-pick role-pick-staff" data-role="staff" aria-pressed="false">
          Staff
        </button>
      </div>

      <form id="register-unified-form" class="form-grid" data-register-fields>
        <input type="hidden" name="role" id="register-role" value="ragazzo">
        <div class="form-row-2">
          <label>
            Nome
            <input type="text" name="nome" required autocomplete="given-name">
          </label>
          <label>
            Cognome
            <input type="text" name="cognome" required autocomplete="family-name">
          </label>
        </div>
        <label>
          Data di nascita
          <input type="date" name="dataNascita" required>
        </label>
        <label id="squadriglia-field">
          Squadriglia
          <input type="text" name="squadriglia" autocomplete="organization">
        </label>
        <label id="branca-field" class="is-hidden" hidden>
          Branca
          <select name="branca">
            <option value="" disabled selected>Seleziona…</option>
            <option value="branco">Branco</option>
            <option value="riparto">Riparto</option>
            <option value="noviziato">Noviziato</option>
            <option value="clan">Clan</option>
          </select>
        </label>
        <label id="email-field">
          Email <span class="hint" id="email-optional-hint" hidden>(facoltativa, per aggiornamenti)</span>
          <input type="email" name="email" required autocomplete="email" placeholder="nome@email.it">
        </label>
        <label id="username-field" class="is-hidden" hidden>
          Username
          <input type="text" name="username" autocomplete="username" placeholder="nome.cognome" spellcheck="false">
          <span class="hint">Se non metti l’email, serve uno username (suggerito: nome.cognome).</span>
        </label>
        <label>
          Password
          <input type="password" name="password" required autocomplete="new-password" minlength="6">
        </label>
        <button class="btn btn-primary" type="submit">Invia richiesta</button>
      </form>
      <p class="form-note" data-register-fields>Hai già un account? <a href="login.html">Accedi</a></p>
      <div id="register-done-actions" class="register-done-actions" hidden>
        <a class="btn btn-primary" href="../index.html">Torna alla home</a>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/cloud-sync.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/branch-view.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
