<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proponi canzoni · Reparto Firenze 1</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" href="../photos/logo.jpeg">
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-links">
        <a href="../index.html?branca=gruppo" data-group-home data-home-base="../">Home</a>
        <a href="../index.html?branca=gruppo#chi-siamo" data-group-home data-home-base="../" data-hash="#chi-siamo">Chi siamo</a>
        <a href="../index.html?branca=gruppo#calendario" data-group-home data-home-base="../" data-hash="#calendario">Calendario</a>
        <a href="../index.html?branca=gruppo#contatti" data-group-home data-home-base="../" data-hash="#contatti">Contatti</a>
      </div>
      <div class="nav-actions" data-auth-slot data-base="../"></div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card" style="width:min(100%,520px)">
      <h1>Proponi una canzone</h1>
      <p class="lead">La proposta arriva allo staff reparto.</p>
      <div id="propose-alert" class="alert alert-ok" hidden></div>
      <form id="propose-form" class="form-grid">
        <label>
          Titolo canzone
          <input type="text" name="title" required placeholder="Es. Bella ciao">
        </label>
        <label>
          Il tuo nome (opzionale)
          <input type="text" name="fromName" placeholder="Nome o squadriglia">
        </label>
        <label>
          Note
          <textarea name="notes" rows="4" placeholder="Link, strofe, perché ti piace…"></textarea>
        </label>
        <button class="btn btn-yellow" type="submit">Invia proposta</button>
      </form>
      <p class="form-note"><a href="./">Torna al canzoniere</a></p>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/canzoniere-store.js"></script>
  <script src="../js/branch-view.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/canzoniere-public.js"></script>
</body>
</html>
