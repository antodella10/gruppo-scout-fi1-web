<html lang="it">

  <meta charset="UTF-8">

  <link rel="stylesheet" href="../css/styles.css">

<body class="canzoniere-page">
  <nav class="site-nav">
    <div class="container">
      <a class="brand" href="../index.html" data-home-link data-home-base="../">
        <img src="../photos/logo.jpeg" alt="Logo Firenze 1">
        <span class="brand-text">Firenze 1</span>
      </a>
      <div class="nav-links">
        <a href="../index.html?branca=gruppo" data-group-home data-home-base="../">Home</a>
        <a href="../chi-siamo.html">Chi siamo</a>

      </div>

    </div>
  </nav>

  <main class="pdf-wrap">
    <div class="pdf-toolbar">
      <div>
        <h1>Canzoniere</h1>
        <p class="book-meta-row">
          <span id="book-meta-line">Reparto · PDF</span>
          <button type="button" class="btn-download" id="pdf-download" hidden title="Scarica canzoniere" aria-label="Scarica canzoniere">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v9.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42L11 13.59V4a1 1 0 0 1 1-1Zm-7 14a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z"/>
            </svg>
          </button>
        </p>
      </div>
      <div class="inline-actions">
        <a class="btn btn-ghost btn-small" href="#canzoni">Canzoni</a>
        <button type="button" class="btn btn-primary btn-small" id="pdf-open" hidden>Apri PDF</button>
        <button type="button" class="btn btn-primary btn-small" id="pdf-fullscreen">Schermo intero</button>
      </div>
    </div>

      <div class="pdf-stage" id="pdf-stage">
      <div class="pdf-empty" id="book-empty" hidden>
        <p id="book-status">Il canzoniere non è ancora stato caricato dallo staff.</p>
      </div>
      <div id="book-viewer" class="pdf-viewer" hidden aria-label="Anteprima canzoniere"></div>
      <iframe id="book-frame" class="pdf-frame" title="Canzoniere PDF" allowfullscreen allow="fullscreen" hidden></iframe>
      <button type="button" class="pdf-exit-fs btn btn-ghost btn-small" id="pdf-exit-fs" hidden>Esci schermo intero</button>
    </div>
  </main>

  <section class="section" id="canzoni">
    <div class="container">
      <div class="section-head section-head-songs">
        <div>
          <h2>Canzoni</h2>
          <p>Canzoni sfuse in ordine alfabetico.</p>
        </div>
        <a class="btn btn-yellow" href="proponi.html">Proponi nuova canzone</a>
      </div>
      <div class="song-list" id="songs-list"></div>
    </div>
  </section>

  <footer class="site-footer">

      <div>© 2026 Firenze 1 · FederScout</div>
      <a href="../index.html" data-home-link data-home-base="../">Torna alla home</a>

  </footer>

  <script src="../js/staff-notifs.js"></script>
  <script src="../js/branch-view.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/canzoniere-public.js"></script>
